name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Regenerate constraints
        run: python -m src.generate_constraints

      - name: Cross-layer verification (Writes reports/verification.json)
        run: python -m src.verify_consistency

      - name: Validate SKOS controlled vocabularies parse
        run: python -m scripts.validate_skos

      - name: Run regression tests
        run: python -m pytest tests/ -q

      # Only schemas/ and neo4j/ are byte-deterministic. generated-shapes.ttl
      # ordering of anonymous SHACL property nodes follows a hash-based BNode
      # order, so it is NOT byte-stable; its semantics are instead covered by
      # the verify_consistency and pytest steps above.
      - name: Detect generated-artifact drift
        run: git diff --exit-code -- schemas/ neo4j/